name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tvluncher-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # A fixed, public URL lets the box fetch the APK itself (e.g. with the
      # Downloader app), so no computer and no ADB client are needed. The tag
      # is recreated on each push so the URL always serves the latest build.
      - name: Publish rolling "apk" release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tvluncher.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk tvluncher.apk \
            --target "$GITHUB_SHA" \
            --title "TV Luncher (dernière version)" \
            --notes "APK construit automatiquement depuis ${GITHUB_SHA::7}. Lien direct : https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/tvluncher.apk"
