name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in a row must not race each other while publishing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu images ship the Android SDK (ANDROID_HOME) and AGP
      # fetches any missing platform itself. android-actions/setup-android@v3
      # now fails there trying to install the removed "tools" package.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Read by app/build.gradle.kts; also written to version.json below.
      - name: Compute version
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tvluncher-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # A fixed, public URL lets the box fetch the APK itself (Downloader, or the
      # in-app updater): releases/latest/download/<file> always serves the newest
      # release. Each build gets its own tag, because GitHub refuses to reuse a
      # tag once its release has been published; only the last few are kept.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tvluncher.apk
          printf '{"versionCode":%d,"versionName":"1.2.%d"}\n' "$VERSION_CODE" "$VERSION_CODE" > version.json
          gh release create "build-$VERSION_CODE" tvluncher.apk version.json \
            --target "$GITHUB_SHA" \
            --latest \
            --title "TV Luncher 1.2.$VERSION_CODE" \
            --notes "APK construit automatiquement depuis ${GITHUB_SHA::7}. Lien direct : https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/tvluncher.apk"
          # Keep the three newest builds; older ones only take space.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | tail -n +4 \
            | xargs -r -n1 gh release delete --yes --cleanup-tag || true
